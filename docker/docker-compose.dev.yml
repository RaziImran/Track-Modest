services:
  postgres:
    image: postgres:16-alpine
    container_name: modest-postgres
    environment:
      POSTGRES_USER: modest
      POSTGRES_PASSWORD: modest
      POSTGRES_DB: modest
    ports:
      - "5432:5432"
    volumes:
      - modest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modest -d modest"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: modest-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - modest-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  modest-postgres-data:
  modest-redis-data:
